name: Deploy Automático para AWS

# 1. O GATILHO: Quando esse robô deve acordar?
# R: Sempre que houver um "push" na branch "main".
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
    
    - name: Baixar o código
      uses: actions/checkout@v6

    
    - name: Login no Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    
    - name: Build e Push da Imagem
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/minha-api:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/minha-api:latest

    
    - name: Deploy na AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_SSH_KEY }}
        
        script: |
          sudo docker stop api-biblioteca || true
          sudo docker rm api-biblioteca || true
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/minha-api:latest
          sudo docker run -d --name api-biblioteca -p 8000:8000 -v volume_banco:/app/dados ${{ secrets.DOCKER_USERNAME }}/minha-api:latest